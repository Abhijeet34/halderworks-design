name: consistency

# The book's own integrity checks, in one place with two callers: ci.yml runs them on every pull
# request so a change that breaks them cannot merge, and maintenance.yml runs them weekly so a
# change in the world can still find them. Before this was factored out the four tools ran only
# on the weekly schedule, and a coverage row or a token drifting from its seed merged green and
# surfaced up to a week later.
#
# A reusable workflow rather than a shell script because the body is already shell: a script
# would add a file that only CI ever calls, and AGENTS.md documents `python3 tools/*.py` as the
# command a person runs. This file is the CI wrapper around those commands, nothing more.
#
# The network liveness check is NOT here: it runs weekly, from maintenance.yml, because a cited
# source rots in months and a per-change network sweep buys no information. Its classifier's
# fixture test is here, because that one is offline and a merge should not be able to break it.

on:
  workflow_call:
    outputs:
      report:
        description: Markdown for the checks that failed; empty when everything passed.
        value: ${{ jobs.consistency.outputs.report }}
      failed:
        description: '1 when at least one check failed, 0 otherwise.'
        value: ${{ jobs.consistency.outputs.failed }}

permissions:
  contents: read

jobs:
  consistency:
    name: the system agrees with itself
    runs-on: ubuntu-24.04
    # tests/run.py alone took 6 to 8 minutes locally (AGENTS.md); 20 leaves room for a slow runner.
    timeout-minutes: 20
    outputs:
      report: ${{ steps.collect.outputs.report }}
      failed: ${{ steps.collect.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tools are standard-library Python 3, so the runner's own python3 is enough and no
      # setup action has to be pinned and moved.
      # Each step writes its own section of the report and records its status, rather than
      # stopping the job, so one failure does not hide the other five.
      - name: run every check
        id: collect
        run: |
          set -uo pipefail
          report=$(mktemp)
          failed=0
          # Full output of every failing check, uploaded as the consistency-logs artifact. The
          # report carries counts and failing rows only: a full tests/run.py transcript is about
          # 1 MB, past the 1024k a job summary accepts, and the upload then fails and shows nothing.
          logs="${RUNNER_TEMP:-$(mktemp -d)}/consistency-logs"
          mkdir -p "$logs"
          echo "logs=$logs" >> "$GITHUB_OUTPUT"
          n=0

          run() {
            local title="$1"; shift
            local out rc=0 log rows
            # `|| rc=$?` rather than a bare assignment: the runner's default shell is
            # `bash -e`, and there errexit kills the whole step on the first failing check -
            # before the report, the outputs or the summary are written, so the issue job
            # downstream would be handed an empty report. An OR list suspends errexit.
            out=$("$@" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              failed=1
              n=$((n + 1))
              log="$n-$(printf '%s' "$title" | tr -cs 'A-Za-z0-9' '-' | cut -c1-60).log"
              printf '%s\n' "$out" > "$logs/$log"
              # The failing rows, or the tail when no row says FAIL, each cut to one line's worth.
              # Anchored at the line start: the mutation suite prints the FAILs it expects
              # indented, and the ramps suite's refusal counts are not failures.
              # `|| true`: past 40 rows head closes the pipe, grep dies of SIGPIPE, and under
              # pipefail and errexit that alone would end the step before anything is reported.
              rows=$(printf '%s\n' "$out" | grep -E '^FAIL|^-- .*: exit [1-9]|^Traceback|^[A-Za-z]*Error' | head -n 40) || true
              [ -n "$rows" ] || rows=$(printf '%s\n' "$out" | tail -n 20) || true
              # shellcheck disable=SC2016 # backticks here are Markdown, not substitutions
              { printf '### %s\n\nexit %s, %s lines of output; full output in the `consistency-logs` artifact as `%s`.\n\n```text\n%s\n```\n\n' \
                  "$title" "$rc" "$(printf '%s\n' "$out" | wc -l | tr -d ' ')" "$log" \
                  "$(printf '%s\n' "$rows" | cut -c1-300)"; } >> "$report"
              printf '::error title=%s::%s\n' "$title" "check failed, see the job summary"
            fi
            printf '%s: exit %s\n' "$title" "$rc"
            printf '%s\n' "$out"
          }

          run "A brand file no longer builds its ramps, or a ramps file is stale" \
            python3 tools/ramps.py --check
          # Every brand, house and products alike, certified by the second instrument, which
          # shares no arithmetic with tools/ramps.py.
          run "A brand's ramps or roles no longer hold" python3 tools/contrast.py
          # The example brands, each exported from its ramps file, so a house change that breaks
          # a product's identity is caught here.
          for dir in examples/*/; do
            dir=${dir%/}
            run "The $dir exporter refused to emit" python3 tools/export.py "$dir"
          done
          run "Two brands paint as one" python3 tools/distinct.py
          run "A vendored face no longer matches the roster" python3 tools/faces.py --vendored
          run "The component sheets or their renders are stale" python3 tools/components.py --check
          run "A Markdown link or anchor no longer resolves" python3 tools/check-links.py
          run "The source classifier no longer agrees with its fixtures" \
            python3 tools/test-check-sources.py

          # The tools above check the token set; this one checks the tools. It clones the
          # repository per mutation case, so it needs the git history the checkout provides.
          run "A refusal the system depends on is not actually refusing" \
            python3 tests/run.py

          # The exporter writes before it reports, so BOTH halves are the check: its own exit
          # status, and the state of the working tree afterwards. `python3 tools/export.py ||
          # true` used to swallow the first half, and the two ways it can refuse both left a
          # clean diff - a traceback writes nothing, and 'not equivalent to tokens.css' on an
          # output already committed changes nothing - so a refusal AGENTS.md promises reached
          # nobody. `git diff --quiet` is also blind to an untracked file, so a new export that
          # was never committed was invisible; `git status --porcelain` sees it.
          run "The exporter refused to emit" python3 tools/export.py
          drift=$(git status --porcelain -- exports/ examples/)
          if [ -n "$drift" ]; then
            failed=1
            # shellcheck disable=SC2016 # backticks here are Markdown, not substitutions
            {
              printf '### An export no longer matches its source\n\n'
              printf 'Regenerating `exports/` or `examples/*/exports/` changed the working tree. '
              printf 'Run `python3 tools/export.py`, and `python3 tools/export.py examples/NAME` '
              printf 'for each brand, and commit the result.\n\n```text\n%s\n```\n\n' "$drift"
            } >> "$report"
            printf '::error title=export drift::exports/ is stale\n'
          fi
          git checkout -- exports/ examples/ 2>/dev/null || true

          # 48,000 bytes keeps the summary far under its 1024k limit and leaves room in the issue
          # body maintenance.yml builds from this report, which GitHub caps at 65,536 characters.
          if [ "$(wc -c < "$report")" -gt 48000 ]; then
            head -c 48000 "$report" > "$report.cut"
            # shellcheck disable=SC2016 # backticks here are Markdown, not substitutions
            printf '\n\n```\n\n**Report cut at 48,000 bytes; every failing check is in the `consistency-logs` artifact.**\n' >> "$report.cut"
            mv "$report.cut" "$report"
          fi
          {
            echo "report<<REPORT_EOF"
            cat "$report"
            echo "REPORT_EOF"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$failed"

      - name: keep the full output of every failing check
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consistency-logs
          path: ${{ steps.collect.outputs.logs }}
          if-no-files-found: ignore
          retention-days: 30

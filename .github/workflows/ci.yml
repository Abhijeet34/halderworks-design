name: CI

# Every job a merge depends on lives in this one file, because the `checks` aggregate at the
# bottom can only `needs:` jobs in its own workflow. The branch ruleset
# (.github/rulesets/main.json) requires exactly that one context, so jobs here can be added or
# renamed without touching branch protection.
#
# Two of the three are the fleet's push gates, re-run in CI. The gates themselves are the
# machine-wide pre-push hooks; this is the backstop for what never met them: a `--no-verify`
# push, a machine without the hooks, and any commit made on GitHub itself. Both are owned by
# Abhijeet34/gates, and the secret scan fails if this repository's synced .gitleaks.toml or
# .githooks/pre-push has drifted from the canonical copy there; re-sync with that repository's
# .ci/gitleaks/sync.sh.
#
# The third is the book's own integrity, shared with the weekly job: .github/workflows/
# consistency.yml is the single definition and maintenance.yml calls the same file.
#
# Linux only, per AGENTS.md. Nothing here rasterises anything or leaves the runner, so a second
# platform would re-run six standard-library Python checks for no new information.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A superseded pull request run is noise. A superseded push run on main is the only record
  # that the merged commit was ever green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `@main` is a moving ref, and it stays one. See AGENTS.md, "What `@main` on the shared gates
  # buys and what it costs": shared-secret-scan.yml fails any caller whose .gitleaks.toml or
  # .githooks/pre-push has drifted from the canonical digests, so a caller pinned to a SHA would
  # keep matching yesterday's digests and the drift detection would be switched off - and would
  # keep running an old scanner after a detection bug was fixed upstream.
  secrets:
    uses: Abhijeet34/gates/.github/workflows/shared-secret-scan.yml@main
  watermark:
    uses: Abhijeet34/gates/.github/workflows/shared-watermark-scan.yml@main
  consistency:
    uses: ./.github/workflows/consistency.yml

  # The single required context. Everything above reaches branch protection through this job and
  # nowhere else, so `if: always()` is load-bearing: without it a failed dependency would leave
  # this job skipped, and a skipped required check is not a failing one.
  checks:
    name: checks
    if: always()
    needs: [secrets, watermark, consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job above must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          # 'skipped' is refused rather than accepted, unlike the same aggregate in the fleet's
          # other repositories: no job above carries an `if:` or a path filter, so nothing here
          # can skip itself legitimately and a skip would mean the workflow was edited wrong.
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              *) echo "::error::a required job reported '$result'" >&2; exit 1 ;;
            esac
          done

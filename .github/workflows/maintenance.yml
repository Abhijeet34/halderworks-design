name: maintenance

# Weekly, and on demand. Everything here is internal consistency plus one liveness check on the
# cited sources. It cannot re-screen the field, and README.md says so where a reader will see it
# before they read a green tick as more than it is.
#
# It opens an issue ONLY when something moved. A quiet week is silent: no issue, no comment, no
# commit. Nothing here ever writes to the repository, so this workflow cannot put a bot commit
# into a public history.
#
# The consistency job is a call into .github/workflows/consistency.yml, which ci.yml also calls
# and which the `checks` context there gates a merge on. This workflow used to carry that job's
# body and its own path-filtered `pull_request` trigger; both are gone, because ci.yml now runs
# the same four tools on every pull request with no path filter. What is left here is the part
# only a schedule can do: the network liveness check, and the issue.
#
# No `push` trigger, deliberately. ci.yml already runs the consistency call on every push to
# main, so a push here added nothing but 26 outbound requests per commit against a field that
# moves in months - and it is how the network check first went red on a commit page, on an
# event whose failure the issue job below was never wired to report.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    uses: ./.github/workflows/consistency.yml

  sources:
    name: every cited source still resolves
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Its own job, not its own exemption: a timed-out CDN must not be able to mask a real
    # contrast failure, which is why this is separate from `consistency`. It used to carry
    # `continue-on-error: true` as well, and that made the job's red X and the run's green
    # tick disagree - the run list recorded 35547340589 as success with this job failed
    # inside it. A failure here now fails the run and opens the issue, which is the only
    # reading under which the check is worth running at all.
    outputs:
      report: ${{ steps.check.outputs.report }}
      failed: ${{ steps.check.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: resolve every cited source
        id: check
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/sources.md"
          failed=0
          # `|| failed=$?` rather than reading `$?` on the next line: the runner's shell is
          # `bash -e`, and there a bare failing command ends the step before the report, the
          # outputs and the summary are written - which would fail the run while handing the
          # issue job below an empty report.
          python3 tools/check-sources.py --report "$report" \
            --summary "$GITHUB_STEP_SUMMARY" || failed=$?
          if [ "$failed" -ne 0 ]; then
            printf '::error title=a cited source no longer resolves::see the job summary\n'
          fi
          {
            echo "report<<REPORT_EOF"
            cat "$report"
            echo "REPORT_EOF"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"
          exit "$failed"

  report:
    name: open an issue, but only if something moved
    needs: [consistency, sources]
    # Every event this workflow runs on, not just the schedule. The old `schedule` gate meant a
    # failure on any other event reached nobody: it surfaced on the commit page and nowhere
    # else, which is where it was found rather than reported.
    if: >-
      always() &&
      (needs.consistency.outputs.failed == '1' || needs.sources.outputs.failed == '1')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: file or update one issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONSISTENCY: ${{ needs.consistency.outputs.report }}
          SOURCES: ${{ needs.sources.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Weekly maintenance found something'
          body=$(mktemp)
          {
            printf 'The weekly run found at least one check that no longer passes.\n\n'
            printf 'Run: %s\n\n' "$RUN_URL"
            printf '%s\n%s\n' "$CONSISTENCY" "$SOURCES"
            printf -- '---\n\n'
            printf 'What this run did **not** check: it did not re-screen the field, judge\n'
            printf 'whether a value is still correct, render a single screen, or re-run the\n'
            # shellcheck disable=SC2016 # backticks here are Markdown, not substitutions
            printf 'coverage cross-check. `README.md` states the boundary in full.\n'
          } > "$body"

          # One open issue, updated rather than duplicated, so a persistent failure does not
          # produce one issue per week.
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
            echo "commented on #$existing"
          else
            gh issue create --title "$title" --body-file "$body" --label maintenance \
              || gh issue create --title "$title" --body-file "$body"
          fi

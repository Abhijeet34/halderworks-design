name: gate shadow

# Runs .github/gates.toml through the gates runner beside ci.yml and records what it decides. It
# gates nothing: the call is in its own file because `needs:` reaches only jobs of the same file,
# so the `checks` aggregate in ci.yml cannot depend on it and the ruleset does not require it.
# The design is Abhijeet34/gates' README, "The shadow job".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-shadow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pinned to the same gates commit as the callers in ci.yml; Dependabot moves them together.
  shadow:
    uses: Abhijeet34/gates/.github/workflows/shared-gate-shadow.yml@2d686fa31bf6f3aea8ef64721811676bae1fc8a5 # v4
